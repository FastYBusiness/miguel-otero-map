<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Plataforma profesional de conocimiento de Miguel Otero Cabaleiro, Estabilizador Operativo de Valor Transversal.">
<title>Miguel Otero Cabaleiro | Estabilizador Operativo de Valor Transversal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

<header class="cabecera">
  <div class="cabecera-contenido">
    <div>
      <div class="cabecera-nombre">Miguel Otero Cabaleiro</div>
      <h1 class="cabecera-titulo">Estabilizador Operativo de Valor Transversal</h1>
      <div class="cabecera-subtitulo">Integración de personas, procesos, recursos, organización y tecnología.</div>
    </div>
    <div class="cabecera-magnitudes" aria-label="Magnitudes profesionales">
      <div class="magnitud"><b id="m-exp">--</b><span>Años</span></div>
      <div class="magnitud"><b id="m-sec">--</b><span>Sectores</span></div>
      <div class="magnitud"><b id="m-emp">--</b><span>Entidades</span></div>
    </div>
  </div>
</header>

<main class="cuerpo">
  <aside class="lateral">
    <div class="caja-buscador">
      <label for="buscador" class="sr-only">Buscar en el mapa de conocimiento</label>
      <input type="search" id="buscador" placeholder="Buscar empresa, curso, maquinaria o competencia..." autocomplete="off" spellcheck="false">
    </div>
    <nav id="menu" aria-label="Navegación por áreas profesionales"></nav>
    <section id="contexto" aria-live="polite">
      <div class="contexto-vacio">Selecciona un área o utiliza el buscador.</div>
    </section>
  </aside>

  <section class="zona-arbol" aria-label="Mapa de conocimiento profesional">
    <div class="barra-herramientas">
      <button type="button" class="btn-herramienta" id="btn-expandir">Expandir árbol</button>
      <button type="button" class="btn-herramienta" id="btn-contraer">Contraer árbol</button>
      <button type="button" class="btn-herramienta" id="btn-limpiar">Restablecer vista</button>
    </div>
    <div class="contenedor-mapa">
      <svg id="mapa" role="img" aria-label="Árbol interactivo de conocimiento profesional"></svg>
    </div>
  </section>
</main>

<footer class="pie">
  Plataforma Profesional de Conocimiento · Miguel Otero Cabaleiro
</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.4"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4"></script>
<script src="app.js"></script>
</body>
</html>
