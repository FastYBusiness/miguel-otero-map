<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mapa de Capacidades Operativas - Miguel Otero Cabaleiro">
  <title>Miguel Otero Cabaleiro | Estabilizador Operativo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, sans-serif;
      background: #F3F3F3;
      -webkit-font-smoothing: antialiased;
      color: #111111;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, #FF9900 0%, #FFD814 100%);
      padding: 20px 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      flex-shrink: 0;
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }

    .header-left {
      flex: 1;
    }

    .header-name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #111111;
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #111111;
    }

    .header-subtitle {
      font-size: 12px;
      font-weight: 500;
      color: #232F3E;
    }

    .header-stats {
      display: flex;
      gap: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      font-size: 18px;
      font-weight: 700;
      color: #111111;
    }

    /* MAIN */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 12px;
      padding: 12px;
    }

    /* SIDEBAR */
    .sidebar {
      width: 200px;
      background: #FFFFFF;
      border: 1px solid #E3E6E6;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .search-box {
      padding: 10px 12px;
      border-bottom: 1px solid #E3E6E6;
    }

    .search-box input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #D5D9D9;
      border-radius: 4px;
      font-size: 11px;
      font-family: inherit;
    }

    .search-box input:focus {
      outline: none;
      border-color: #FF9900;
      box-shadow: 0 0 0 2px rgba(255,153,0,0.1);
    }

    .nav-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      border-bottom: 1px solid #E3E6E6;
    }

    .nav-btn {
      display: block;
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 4px;
      background: #FAFAFA;
      border: 1px solid #E3E6E6;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      color: #232F3E;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }

    .nav-btn:hover {
      background: #FFFFFF;
      border-color: #FF9900;
      color: #FF9900;
      transform: translateX(2px);
    }

    .nav-btn.active {
      background: #FF9900;
      border-color: #FF9900;
      color: #FFFFFF;
    }

    .context {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      border-top: 1px solid #E3E6E6;
      font-size: 11px;
      color: #565959;
      line-height: 1.5;
    }

    .context-empty {
      text-align: center;
      padding-top: 40px;
      opacity: 0.6;
    }

    .context-title {
      font-size: 12px;
      font-weight: 700;
      color: #111111;
      margin-bottom: 6px;
    }

    .context-text {
      font-size: 10px;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    /* TREE */
    .tree-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #FFFFFF;
      border: 1px solid #E3E6E6;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .tree-toolbar {
      padding: 8px 12px;
      border-bottom: 1px solid #E3E6E6;
      display: flex;
      gap: 6px;
      background: #FAFAFA;
    }

    .btn-tree {
      padding: 5px 10px;
      background: #FFFFFF;
      border: 1px solid #D5D9D9;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #232F3E;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-tree:hover {
      border-color: #FF9900;
      color: #FF9900;
    }

    .tree-container {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* MARKMAP STYLES */
    .markmap text {
      fill: #111111 !important;
      font-size: 11px !important;
      font-weight: 500;
      pointer-events: all;
    }

    .markmap path {
      stroke: #37475A !important;
      stroke-width: 1.5px !important;
      stroke-linecap: round;
      opacity: 0.65;
    }

    .markmap circle {
      fill: #FF9900 !important;
      r: 3.5px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .markmap-node:hover circle {
      fill: #FFD814 !important;
      r: 5px;
      filter: drop-shadow(0 1px 4px rgba(255,153,0,0.3));
    }

    .markmap-node:hover text {
      fill: #232F3E !important;
      font-weight: 600;
    }

    /* RESPONSIVE */
    @media (max-width: 1024px) {
      .header-subtitle {
        display: none;
      }

      .main {
        flex-direction: column-reverse;
      }

      .sidebar {
        width: 100%;
        max-height: 120px;
        flex-direction: row;
      }

      .nav-container {
        flex: 1;
        border-right: 1px solid #E3E6E6;
        border-bottom: none;
        overflow-x: auto;
        overflow-y: hidden;
        display: flex;
        gap: 6px;
      }

      .nav-btn {
        flex-shrink: 0;
        min-width: 80px;
        margin: 0;
      }

      .search-box {
        border-right: 1px solid #E3E6E6;
        border-bottom: none;
        padding: 8px;
      }

      .context {
        display: none;
      }
    }

    @media (max-width: 768px) {
      .header-title {
        font-size: 16px;
      }

      .header-stats {
        gap: 12px;
      }

      .stat-number {
        font-size: 14px;
      }

      .main {
        padding: 8px;
        gap: 8px;
      }
    }

    /* SCROLLBAR */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #FAFAFA;
    }

    ::-webkit-scrollbar-thumb {
      background: #D5D9D9;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #FF9900;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-content">
        <div class="header-left">
          <div class="header-name">Miguel Otero Cabaleiro</div>
          <div class="header-title">ESTABILIZADOR OPERATIVO</div>
          <div class="header-subtitle">Integración de personas, procesos, recursos y tecnología</div>
        </div>
        <div class="header-stats">
          <div class="stat-item">
            <div class="stat-number">35+</div>
            <div>Años</div>
          </div>
          <div class="stat-item">
            <div class="stat-number">20+</div>
            <div>Sectores</div>
          </div>
          <div class="stat-item">
            <div class="stat-number">30+</div>
            <div>Certs</div>
          </div>
        </div>
      </div>
    </header>

    <div class="main">
      <aside class="sidebar">
        <div class="search-box">
          <input type="text" id="search" placeholder="🔍 Buscar...">
        </div>
        <div class="nav-container" id="nav"></div>
        <div class="context" id="context">
          <div class="context-empty">Selecciona un nodo</div>
        </div>
      </aside>

      <section class="tree-section">
        <div class="tree-toolbar">
          <button class="btn-tree" id="btnExpand">▼ Expandir</button>
          <button class="btn-tree" id="btnCollapse">▲ Contraer</button>
          <button class="btn-tree" id="btnReset">✕ Limpiar</button>
        </div>
        <div class="tree-container">
          <svg id="map"></svg>
        </div>
      </section>
    </div>
  </div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4/dist/index.min.js"></script>

  <script>
    const DATA = {
      "content": "Miguel Otero Cabaleiro",
      "id": "root",
      "children": [
        {
          "content": "PROPUESTA DE VALOR",
          "id": "propuesta",
          "children": [
            { "content": "Resolver problemas reales" },
            { "content": "Estabilizar operaciones" },
            { "content": "Coordinar equipos" },
            { "content": "Integrar procesos" },
            { "content": "Optimizar recursos" },
            { "content": "Adaptación rápida" }
          ]
        },
        {
          "content": "CAPACIDADES CORE",
          "id": "capacidades",
          "children": [
            {
              "content": "Integración Transversal",
              "id": "integracion",
              "children": [
                { "content": "Personas" },
                { "content": "Procesos" },
                { "content": "Operaciones" },
                { "content": "Tecnología" },
                { "content": "Organización" }
              ]
            },
            {
              "content": "Resolución de Problemas",
              "id": "resolucion",
              "children": [
                { "content": "Diagnóstico" },
                { "content": "Estabilización" },
                { "content": "Optimización" },
                { "content": "Escalado" }
              ]
            },
            {
              "content": "Liderazgo Situacional",
              "id": "liderazgo",
              "children": [
                { "content": "Coordinación" },
                { "content": "Negociación" },
                { "content": "Gestión de crisis" },
                { "content": "Confianza" }
              ]
            }
          ]
        },
        {
          "content": "ESPECIALIDADES",
          "id": "especialidades",
          "children": [
            {
              "content": "Operaciones & Logística",
              "id": "espec-op",
              "children": [
                { "content": "Obra civil" },
                { "content": "Maquinaria pesada" },
                { "content": "Distribución" },
                { "content": "Logística" }
              ]
            },
            {
              "content": "Coordinación Institucional",
              "id": "espec-lid",
              "children": [
                { "content": "Gestión asociativa" },
                { "content": "Interlocución pública" },
                { "content": "Subvenciones" },
                { "content": "Coordinación multiactor" }
              ]
            },
            {
              "content": "Personas & Bienestar",
              "id": "espec-per",
              "children": [
                { "content": "Yoga (580h)" },
                { "content": "Terapia O.D.Í.N.E." },
                { "content": "Masaje terapéutico" },
                { "content": "Mentoría" }
              ]
            },
            {
              "content": "Tecnología & Innovación",
              "id": "espec-tec",
              "children": [
                { "content": "IA aplicada" },
                { "content": "Automatización" },
                { "content": "Análisis" },
                { "content": "Digitalización" }
              ]
            }
          ]
        },
        {
          "content": "EVIDENCIAS",
          "id": "evidencias",
          "children": [
            {
              "content": "Oficiales",
              "children": [
                { "content": "DOG 18/08/2014" },
                { "content": "Subvenciones 2016-2018" },
                { "content": "Registros verificados" }
              ]
            },
            {
              "content": "Académicas",
              "children": [
                { "content": "30+ certificaciones" },
                { "content": "FP2 Mecánica" },
                { "content": "Máster IA 2026" },
                { "content": "Vedanta (13 años)" }
              ]
            },
            {
              "content": "Laborales",
              "children": [
                { "content": "12+ empresas obra pública" },
                { "content": "Distribución alimentaria" },
                { "content": "Proyectos verificables" },
                { "content": "Redes MLM (12+ años)" }
              ]
            }
          ]
        },
        {
          "content": "EXPERIENCIA",
          "id": "experiencia",
          "children": [
            {
              "content": "1988-2008: Industrial",
              "children": [
                { "content": "Obra civil" },
                { "content": "Cuenca 2005-2008 (64T)" },
                { "content": "Decisión familiar" }
              ]
            },
            {
              "content": "2008-2020: Liderazgo",
              "children": [
                { "content": "Federación Rías Baixas" },
                { "content": "O Corazón Meaño" },
                { "content": "65+ empresarios" }
              ]
            },
            {
              "content": "2013-2025: Espiritual",
              "children": [
                { "content": "13 años Maestra Ana GI" },
                { "content": "+1000 horas" },
                { "content": "Yoga Altea" }
              ]
            },
            {
              "content": "2023-2026: Digital",
              "children": [
                { "content": "Yoga 580h" },
                { "content": "O.D.Í.N.E. +200h" },
                { "content": "Máster IA" }
              ]
            }
          ]
        }
      ]
    };

    const CONTEXT = {
      "integracion": {
        "title": "Integración Transversal",
        "text": "Integrar simultáneamente personas, procesos, operaciones, tecnología y organización en un sistema coherente."
      },
      "resolucion": {
        "title": "Resolución de Problemas",
        "text": "Diagnosticar situaciones complejas, estabilizar operaciones, optimizar continuidad y escalar soluciones."
      },
      "liderazgo": {
        "title": "Liderazgo Situacional",
        "text": "Adaptación dinámica de estilo según contexto: grupos pequeños, instituciones públicas, equipos multidisciplinares."
      },
      "espec-op": {
        "title": "Operaciones & Logística",
        "text": "Experiencia verificada en obra civil, maquinaria pesada (64T), sistemas de distribución y optimización logística."
      },
      "espec-lid": {
        "title": "Coordinación Institucional",
        "text": "Gestión de asociaciones, negociación pública, acceso a subvenciones y coordinación multiactor."
      },
      "espec-per": {
        "title": "Personas & Bienestar",
        "text": "Formación profesional: Yoga, Terapia O.D.Í.N.E., masaje terapéutico. Enfoque integral de bienestar."
      },
      "espec-tec": {
        "title": "Tecnología & Innovación",
        "text": "IA aplicada a optimización operativa, automatización de procesos, análisis de datos y gestión digital."
      }
    };

    class App {
      constructor() {
        this.markmap = null;
        this.specialties = [
          { id: 'espec-op', label: 'Operaciones' },
          { id: 'espec-lid', label: 'Liderazgo' },
          { id: 'espec-per', label: 'Personas' },
          { id: 'espec-tec', label: 'Tecnología' }
        ];
        this.init();
      }

      init() {
        this.renderNav();
        this.createTree();
        this.setupListeners();
      }

      renderNav() {
        const nav = document.getElementById('nav');
        nav.innerHTML = this.specialties
          .map(s => `<button class="nav-btn" data-id="${s.id}">${s.label}</button>`)
          .join('');

        nav.querySelectorAll('.nav-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            nav.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const id = btn.dataset.id;
            this.showContext(id);
          });
        });
      }

      createTree() {
        const { Markmap } = window.markmap;
        this.markmap = Markmap.create('#map', {
          autoFit: true,
          initialExpandLevel: 1,
          duration: 300,
          maxWidth: 250,
          zoom: true,
          pan: true
        }, DATA);
      }

      showContext(id) {
        const info = CONTEXT[id];
        const ctx = document.getElementById('context');
        if (info) {
          ctx.innerHTML = `
            <div class="context-title">${info.title}</div>
            <div class="context-text">${info.text}</div>
          `;
        }
      }

      setupListeners() {
        document.getElementById('btnExpand').addEventListener('click', () => {
          console.log('Expandir');
        });

        document.getElementById('btnCollapse').addEventListener('click', () => {
          console.log('Contraer');
        });

        document.getElementById('btnReset').addEventListener('click', () => {
          document.getElementById('context').innerHTML = '<div class="context-empty">Selecciona un nodo</div>';
          document.getElementById('nav').querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        });

        document.getElementById('search').addEventListener('input', (e) => {
          const query = e.target.value.toLowerCase();
          if (query.length > 0) {
            console.log('Buscando:', query);
          }
        });
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      new App();
    });
  </script>
</body>
</html>
