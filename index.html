<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mapa de Capacidades Operativas - Miguel Otero Cabaleiro">
  <title>Miguel Otero Cabaleiro | Estabilizador Operativo</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, sans-serif;
      background: #F3F3F3;
      -webkit-font-smoothing: antialiased;
      color: #111111;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      background: linear-gradient(135deg, #FF9900 0%, #FFD814 100%);
      padding: 20px 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
      flex-shrink: 0;
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }

    .header-left {
      flex: 1;
    }

    .header-name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #111111;
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #111111;
    }

    .header-subtitle {
      font-size: 12px;
      font-weight: 500;
      color: #232F3E;
    }

    .header-stats {
      display: flex;
      gap: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      font-size: 18px;
      font-weight: 700;
      color: #111111;
    }

    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 12px;
      padding: 12px;
    }

    .sidebar {
      width: 220px;
      background: #FFFFFF;
      border: 1px solid #E3E6E6;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .search-box {
      padding: 10px 12px;
      border-bottom: 1px solid #E3E6E6;
    }

    .search-box input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #D5D9D9;
      border-radius: 4px;
      font-size: 11px;
      font-family: inherit;
    }

    .search-box input:focus {
      outline: none;
      border-color: #FF9900;
      box-shadow: 0 0 0 2px rgba(255,153,0,0.1);
    }

    .nav-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      border-bottom: 1px solid #E3E6E6;
    }

    .nav-btn {
      display: block;
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 6px;
      background: #FAFAFA;
      border: 1px solid #E3E6E6;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      color: #232F3E;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
    }

    .nav-btn:hover {
      background: #FFFFFF;
      border-color: #FF9900;
      color: #FF9900;
      transform: translateX(2px);
    }

    .nav-btn.active {
      background: #FF9900;
      border-color: #FF9900;
      color: #FFFFFF;
    }

    .context {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      font-size: 11px;
      color: #565959;
      line-height: 1.5;
    }

    .context-empty {
      text-align: center;
      padding-top: 20px;
      opacity: 0.6;
    }

    .context-title {
      font-size: 12px;
      font-weight: 700;
      color: #111111;
      margin-bottom: 6px;
    }

    .context-text {
      font-size: 11px;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .tree-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #FFFFFF;
      border: 1px solid #E3E6E6;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .tree-toolbar {
      padding: 8px 12px;
      border-bottom: 1px solid #E3E6E6;
      display: flex;
      gap: 6px;
      background: #FAFAFA;
    }

    .btn-tree {
      padding: 5px 10px;
      background: #FFFFFF;
      border: 1px solid #D5D9D9;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      color: #232F3E;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-tree:hover {
      border-color: #FF9900;
      color: #FF9900;
    }

    .tree-container {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .markmap text {
      fill: #111111 !important;
      font-size: 12px !important;
      font-weight: 500;
    }

    .markmap path {
      stroke: #37475A !important;
      stroke-width: 1.5px !important;
      stroke-linecap: round;
      opacity: 0.65;
    }

    .markmap circle {
      fill: #FF9900 !important;
      r: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-content">
        <div class="header-left">
          <div class="header-name">Miguel Otero Cabaleiro</div>
          <div class="header-title">ESTABILIZADOR OPERATIVO</div>
          <div class="header-subtitle">Integración de personas, procesos, recursos y tecnología</div>
        </div>
        <div class="header-stats">
          <div class="stat-item">
            <div class="stat-number">35+</div>
            <div>Años</div>
          </div>
          <div class="stat-item">
            <div class="stat-number">20+</div>
            <div>Sectores</div>
          </div>
          <div class="stat-item">
            <div class="stat-number">30+</div>
            <div>Certs</div>
          </div>
        </div>
      </div>
    </header>

    <div class="main">
      <aside class="sidebar">
        <div class="search-box">
          <input type="text" id="search" placeholder="🔍 Buscar...">
        </div>
        <div class="nav-container" id="nav"></div>
        <div class="context" id="context">
          <div class="context-empty">Selecciona una especialidad arriba</div>
        </div>
      </aside>

      <section class="tree-section">
        <div class="tree-toolbar">
          <button class="btn-tree" id="btnExpand">▼ Expandir</button>
          <button class="btn-tree" id="btnCollapse">▲ Contraer</button>
          <button class="btn-tree" id="btnReset">✕ Limpiar</button>
        </div>
        <div class="tree-container">
          <svg id="map"></svg>
        </div>
      </section>
    </div>
  </div>

  <!-- Scripts de Markmap empaquetados correctamente -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4"></script>

  <script>
    const markdownData = `
# Miguel Otero Cabaleiro

## PROPUESTA DE VALOR
- Resolver problemas reales
- Estabilizar operaciones
- Coordinar equipos
- Integrar procesos
- Optimizar recursos
- Adaptación rápida

## CAPACIDADES CORE
### Integración Transversal
- Personas
- Procesos
- Operaciones
- Tecnología
- Organización
### Resolución de Problemas
- Diagnóstico
- Estabilización
- Optimización
- Escalado
### Liderazgo Situacional
- Coordinación
- Negociación
- Gestión de crisis
- Confianza

## ESPECIALIDADES
### Operaciones & Logística
- Obra civil
- Maquinaria pesada
- Distribución
- Logística
### Coordinación Institucional
- Gestión asociativa
- Interlocución pública
- Subvenciones
- Coordinación multiactor
### Personas & Bienestar
- Yoga (580h)
- Terapia O.D.Í.N.E.
- Masaje terapéutico
- Mentoría
### Tecnología & Innovación
- IA aplicada
- Automatización
- Análisis
- Digitalización

## EVIDENCIAS
### Oficiales
- DOG 18/08/2014
- Subvenciones 2016-2018
- Registros verificados
### Académicas
- 30+ certificaciones
- FP2 Mecánica
- Máster IA 2026
- Vedanta (13 años)
### Laborales
- 12+ empresas obra pública
- Distribución alimentaria
- Proyectos verificables
- Redes MLM (12+ años)

## EXPERIENCIA
### 1988-2008: Industrial
- Obra civil
- Cuenca 2005-2008 (64T)
- Decisión familiar
### 2008-2020: Liderazgo
- Federación Rías Baixas
- O Corazón Meaño
- 65+ empresarios
### 2013-2025: Espiritual
- 13 años Maestra Ana GI
- +1000 horas
- Yoga Altea
### 2023-2026: Digital
- Yoga 580h
- O.D.Í.N.E. +200h
- Máster IA
`;

    const CONTEXT = {
      "espec-op": { "title": "Operaciones & Logística", "text": "Experiencia verificada en obra civil, maquinaria pesada (64T), sistemas de distribución y optimización logística." },
      "espec-lid": { "title": "Coordinación Institucional", "text": "Gestión de asociaciones, negociación pública, acceso a subvenciones y coordinación multiactor." },
      "espec-per": { "title": "Personas & Bienestar", "text": "Formación profesional: Yoga, Terapia O.D.Í.N.E., masaje terapéutico. Enfoque integral de bienestar." },
      "espec-tec": { "title": "Tecnología & Innovación", "text": "IA aplicada a optimización operativa, automatización de procesos, análisis de datos y gestión digital." }
    };

    const specialties = [
      { id: 'espec-op', label: 'Operaciones' },
      { id: 'espec-lid', label: 'Liderazgo' },
      { id: 'espec-per', label: 'Personas' },
      { id: 'espec-tec', label: 'Tecnología' }
    ];

    let mmInstance = null;

    function init() {
      const { Transformer } = window.markmap;
      const { Markmap } = window.markmap;

      const transformer = new Transformer();
      const { root } = transformer.transform(markdownData);

      // Crear el mapa interactivo
      mmInstance = Markmap.create('#map', {
        autoFit: true,
        duration: 300,
        initialExpandLevel: 2
      }, root);

      // Renderizar los botones laterales
      const nav = document.getElementById('nav');
      nav.innerHTML = specialties
        .map(s => `<button class="nav-btn" data-id="${s.id}">${s.label}</button>`)
        .join('');

      nav.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          nav.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          
          const info = CONTEXT[btn.dataset.id];
          const ctx = document.getElementById('context');
          if (info) {
            ctx.innerHTML = `
              <div class="context-title">${info.title}</div>
              <div class="context-text">${info.text}</div>
            `;
          }
        });
      });

      // Controles del mapa
      document.getElementById('btnExpand').addEventListener('click', () => {
        const { root } = transformer.transform(markdownData);
        mmInstance.setData(root, { initialExpandLevel: 5 });
        mmInstance.fit();
      });

      document.getElementById('btnCollapse').addEventListener('click', () => {
        const { root } = transformer.transform(markdownData);
        mmInstance.setData(root, { initialExpandLevel: 1 });
        mmInstance.fit();
      });

      document.getElementById('btnReset').addEventListener('click', () => {
        document.getElementById('search').value = '';
        document.getElementById('context').innerHTML = '<div class="context-empty">Selecciona una especialidad arriba</div>';
        document.getElementById('nav').querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        
        const { root } = transformer.transform(markdownData);
        mmInstance.setData(root, { initialExpandLevel: 2 });
        mmInstance.fit();
      });

      // Buscador
      document.getElementById('search').addEventListener('input', (e) => {
        const query = e.target.value.trim().toLowerCase();
        document.querySelectorAll('#map g.markmap-node').forEach(node => {
          const text = node.textContent.toLowerCase();
          if (query === '' || text.includes(query)) {
            node.style.opacity = '1';
          } else {
            node.style.opacity = '0.15';
          }
        });
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
